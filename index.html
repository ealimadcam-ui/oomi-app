<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px; font-family: sans-serif;">
            <div style="display: inline-block; width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h4 style="color: #28a745; margin-top: 20px;">OOMI... جاري تحميل المتجر</h4>
        </div>
    </div>

    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script src="_framework/blazor.webassembly.zxhwjtv6sc.js" autostart="false"></script>
    
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // نترك النظام يبحث عن المسارات الافتراضية المشفرة
                return defaultUri;
            }
        });
    </script>
</body>
</html>
