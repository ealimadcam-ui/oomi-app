<script src="_framework/blazor.webassembly.js" autostart="false"></script>
<script>
    if (window.Blazor) {
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // أي ملف يطلبه النظام، سنبحث عنه في مجلد app-bin 
                // وسنحاول مطابقة الاسم مهما كانت الإضافات المشفرة
                console.log("OOMI Routing: Attempting to load " + name);
                
                // التوجيه لمجلد app-bin لضمان الابتعاد عن قيود GitHub على المجلدات التي تبدأ بـ _
                return `app-bin/${name}?v=${new Date().getTime()}`;
            }
        });
    }
</script>
