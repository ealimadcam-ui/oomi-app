<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px;">
            <div style="display: inline-block; width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h4 style="color: #28a745; margin-top: 20px;">OOMI... جاري إطلاق التحديث الجديد</h4>
            <p style="color: #6c757d;">أبو قصي.. يتم الآن الربط عبر الجسر التقني لضمان استقرار البيانات</p>
        </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <!-- ملف التشغيل الرئيسي لـ Blazor -->
    <script src="app-bin/blazor.webassembly.zxhwjtv6sc.js" autostart="false"></script>
    
    <script>
        // مسميات ملفات النظام الخاصة بمشروعك
        const dotnetJs = 'dotnet.27fkkz9ckm.js';
        const dotnetNative = 'dotnet.native.o027ce4ny1.js';
        const dotnetRuntime = 'dotnet.runtime.2zl32tp6ah.js';

        // 💡 استخدام Corsproxy.io لحل مشكلة الحجب والـ Reset نهائياً
        const proxyPrefix = "https://corsproxy.io/?";

        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // تحميل ملفات النظام من المجلد الفرعي app-bin
                    if (name === 'dotnet.js') return `app-bin/${dotnetJs}?v=${new Date().getTime()}`;
                    if (name === 'dotnet.native.js') return `app-bin/${dotnetNative}?v=${new Date().getTime()}`;
                    if (name === 'dotnet.runtime.js') return `app-bin/${dotnetRuntime}?v=${new Date().getTime()}`;
                    
                    return `app-bin/${name}?v=${new Date().getTime()}`;
                }
            });
        }

        /**
         * 🛠️ معالج الطلبات (Interceptor):
         * يقوم هذا الجزء باكتشاف أي طلب موجه لسيرفر SmarterASP ويقوم 
         * بتمريره عبر البروكسي لكسر قيود الأمان في المتصفح.
         **/
        const originalFetch = window.fetch;
        window.fetch = async (...args) => {
            let resource = args[0];
            if (typeof resource === 'string' && resource.includes('jtempurl.com')) {
                // تحويل الرابط ليكون عبر البروكسي مع التأكد من استخدام http للسيرفر
                let targetUrl = resource.replace('https://', 'http://');
                args[0] = proxyPrefix + encodeURIComponent(targetUrl);
            }
            return originalFetch(...args);
        };
    </script>
</body>
</html>
