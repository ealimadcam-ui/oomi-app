<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    <link rel="stylesheet" href="./lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="./OOMI.Client.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 50px;">جاري تحميل متجر أوومي...</div>
    </div>

    <script src="./_framework/blazor.webassembly.zxhwjtv6sc.js" autostart="false"></script>
    <script>
        // هذا الجزء يحل مشكلة الـ 404 لملفات dotnet.js
        navigator.serviceWorker.register('service-worker.js');
        var path = window.location.pathname.split('/');
        var base = path.slice(0, path.length - 1).join('/') + '/';
        
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // إجبار النظام على البحث عن الملفات في مجلد _framework الصحيح
                return `_framework/${name}`;
            }
        });
    </script>
</body>
</html>
