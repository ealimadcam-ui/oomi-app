<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <div class="text-center mt-5">
            <div class="spinner-border text-success mb-2" role="status"></div>
            <h4 class="text-success fw-bold">OOMI... جاري تحميل المتجر</h4>
        </div>
    </div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع في نظام أوومي.
        <a href="." class="reload">تحديث الصفحة</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // متغير عالمي لحفظ العنوان المختار لضمان الوصول إليه من C#
        window.selectedLocationText = "الرياض، المملكة العربية السعودية";

        window.initializeMap = () => {
            // إحداثيات الرياض كمركز افتراضي
            var defaultLat = 24.7136;
            var defaultLon = 46.6753;

            // التأكد من تنظيف حاوية الخريطة قبل إعادة الإنشاء لمنع أخطاء الـ DOM
            var container = L.DomUtil.get('map');
            if (container != null) {
                container._leaflet_id = null;
            }

            // إنشاء الخريطة
            var map = L.map('map').setView([defaultLat, defaultLon], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // إضافة الدبوس (Marker) وتفعيله للسحب
            var marker = L.marker([defaultLat, defaultLon], {
                draggable: true,
                autoPan: true
            }).addTo(map);

            // تحديث المتغير العالمي عند الانتهاء من سحب الدبوس
            marker.on('dragend', function (event) {
                var position = marker.getLatLng();
                // تنسيق النص الذي سيتم حفظه كـ SavedLocation
                window.selectedLocationText = "موقع مخصص: " + position.lat.toFixed(5) + " , " + position.lng.toFixed(5);
                console.log("OOMI Map Log: " + window.selectedLocationText);
            });

            // معالجة مشكلة ظهور أجزاء رمادية في الخريطة عند التحميل الأول
            setTimeout(function () {
                map.invalidateSize();
            }, 600);
        };

        // الدالة التي يستدعيها كود C# في صفحة SelectLocation
        window.getSelectedAddress = () => {
            console.log("C# requested address: " + window.selectedLocationText);
            return window.selectedLocationText;
        };
    </script>
</body>
</html>
