<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI</title>
    <base href="/oomi-app/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">جاري تحميل الأصناف...</div>

    <!-- تشغيل المحرك بدون فحص النزاهة وبدون Service Worker -->
   <script src="app-bin/blazor.webassembly.js" autostart="false"></script>
<script>
    if (typeof Blazor !== 'undefined') {
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // إجبار النظام على القراءة من المجلد الجديد
                return `app-bin/${name}`;
            }
        });
    }
</script>
</body>
</html>
