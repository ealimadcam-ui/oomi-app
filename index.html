<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI</title>
    <base href="/oomi-app/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">جاري تحميل المتجر...</div>

    <!-- استدعاء المحرك من المجلد الجديد app-bin -->
    <script src="app-bin/blazor.webassembly.js" autostart="false"></script>
    
    <script>
        window.onload = function() {
            if (typeof Blazor !== 'undefined') {
                Blazor.start({
                    loadBootResource: function (type, name, defaultUri, integrity) {
                        // إجبار النظام على سحب كافة ملفات الـ DLL من app-bin
                        return `app-bin/${name}`;
                    }
                });
            } else {
                console.error("OOMI Error: Blazor engine failed to load from app-bin.");
            }
        };
    </script>
</body>
</html>
