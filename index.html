<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px;">
            <h3 style="color: #28a745;">أبو قصي.. جاري الربط النهائي</h3>
        </div>
    </div>

    <script src="app-bin/blazor.webassembly.zxhwjtv6sc.js" autostart="false"></script>
    
    <script>
        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // إذا كان الملف المطلوب هو dotnet.js، تأكد من مساره الصحيح
                    if (name === 'dotnet.js') {
                        return `app-bin/dotnet.js?v=${new Date().getTime()}`;
                    }
                    return `app-bin/${name}?v=${new Date().getTime()}`;
                }
            });
        }
    </script>
</body>
</html>
