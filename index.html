<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px; font-family: sans-serif;">
            <div style="display: inline-block; width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h3 style="color: #28a745; margin-top: 25px;">جاري تشغيل نظام OOMI</h3>
            <p style="color: #666;">فضلاً انتظر لحظات لتحميل القائمة...</p>
        </div>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { background-color: #ffffff; margin: 0; padding: 0; }
    </style>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // 1. معالجة الملفات التي أعدنا تسميتها يدوياً لتطابق الواقع في GitHub
                if (name === 'dotnet.runtime.js') return `_framework/dotnet.runtime.js?v=${new Date().getTime()}`;
                if (name === 'dotnet.native.js') return `_framework/dotnet.native.js?v=${new Date().getTime()}`;
                if (name === 'dotnet.native.wasm') return `_framework/dotnet.native.wasm?v=${new Date().getTime()}`;
                if (name === 'dotnet.js') return `_framework/dotnet.js?v=${new Date().getTime()}`;

                // 2. معالجة بقية الملفات (147 ملف) وإضافة كاسر الكاش لضمان وصولها
                // مع تجاهل الـ integrity لأننا عدلنا الملفات يدوياً
                return `_framework/${name}?v=${new Date().getTime()}`;
            }
        });
    </script>
</body>
</html>
