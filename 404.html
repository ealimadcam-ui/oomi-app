<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px; font-family: sans-serif;">
            <div style="display: inline-block; width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h4 style="color: #28a745; margin-top: 20px;">OOMI... جاري تشغيل المتجر</h4>
        </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script src="app-bin/blazor.webassembly.js" autostart="false"></script>
    
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                // توجيه كل طلبات النظام إلى المجلد الجديد النظيف
                return `app-bin/${name}?v=${new Date().getTime()}`;
            }
        });
    </script>
</body>
</html>
