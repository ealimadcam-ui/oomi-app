<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OOMI - اطلب الآن</title>
    <base href="/oomi-app/" /> 
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="OOMI.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="text-align:center; margin-top: 100px; font-family: sans-serif;">
            <div style="display: inline-block; width: 60px; height: 60px; border: 6px solid #f3f3f3; border-top: 6px solid #28a745; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h3 style="color: #28a745; margin-top: 25px;">جاري تشغيل نظام OOMI</h3>
            <p style="color: #666;">أبو قصي، هانت.. لحظات ويفتح المتجر</p>
        </div>
    </div>

    <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body { background-color: #ffffff; margin: 0; padding: 0; }
    </style>

    <script src="app-bin/blazor.webassembly.js" autostart="false"></script>
    
    <script>
        // فحص "هندسي" للتأكد من تحميل ملف التشغيل قبل البدء
        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // توجيه كافة الطلبات لمجلد app-bin مع كسر الكاش
                    return `app-bin/${name}?v=${new Date().getTime()}`;
                }
            });
        } else {
            console.error("خطأ: لم يتم العثور على ملف blazor.webassembly.js في مجلد app-bin");
            // محاولة بديلة إذا كان الملف في المجلد الرئيسي
            var retryScript = document.createElement('script');
            retryScript.src = "blazor.webassembly.js";
            document.body.appendChild(retryScript);
        }
    </script>
</body>
</html>
